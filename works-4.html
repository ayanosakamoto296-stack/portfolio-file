<!DOCTYPE html>
<html>
  <head>
    <title>Organic Cafe</title>
    <meta charset="UTF-8" />
    <meta name="description" content="自家焙煎のコーヒーがお家で楽しめるOrganic Cafe"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/coffee-style.css" />
  </head>
  <body>
    <!-- ヘッダー -->
    <header>
      <!-- ロゴ -->
      <a href="works-4.html" id="logo">
        <img src="coffee-images/logo.png" alt="トップページに戻る"/>
      </a>

      <!-- PC用ナビゲーション -->
      <nav id="nav-pc">
        <a href="works-4.html#concept">CONCEPT</a>
        <a href="works-4.html#product">PRODUCT</a>
        <a href="works-4.html#contact">CONTACT</a>
      </nav>

      <!-- スマホ用メニューボタン -->
      <img id="menu-sp" src="coffee-images/button-menu.png" alt="ナビゲーションを開く" onclick="document.getElementById('nav-sp').style.display = 'block'">
      </header>

      <!-- スマホ用ナビゲーション -->
       <nav id="nav-sp">
        <ul>
          <li>
          <img id="close" src="coffee-images/button-close.png" alt="ナビゲーションを閉じる" onclick="document.getElementById('nav-sp').style.display = 'none'">
          </li>
          <li>
            <a id="logo-sp" href="works-4.html" onclick="document.getElementById('nav-sp').style.display = 'none'">
            <img src="coffee-images/logo-sp.png" alt="トップページに戻る">
            </a>
          </li>
          <li>
            <a class="menu" href="works-4.html#concept" onclick="document.getElementById('nav-sp').style.display = 'none'">CONCEPT</a>
          </li>
          <li>
            <a class="menu" href="works-4.html#product" onclick="document.getElementById('nav-sp').style.display = 'none'">PRODUCT</a>
          </li>
          <li>
            <a class="menu" href="works-4.html#contact" onclick="document.getElementById('nav-sp').style.display = 'none'">CONTACT</a>
          </li>
        </ul> 
      </nav>

    <main>
      <article>
        <!-- メインビジュアル -->
        <section id="main-visual">
          <div id="main-message">
            <h1>Organic Cafe</h1>
            <p>自家焙煎コーヒーが買えるお店</p>
          </div>
          <img src="coffee-images/main-image.jpg" alt="コーヒーをハンドドリップで淹れる画像"/>
        </section>
      </article>
    </main>
  </body>
</html>
